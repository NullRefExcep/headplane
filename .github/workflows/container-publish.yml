name: Publish container
on:
  push:
    branches:
      - "deploy/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'NullRefExcep/headplane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Image metadata
        id: image
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#deploy/}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nullrefexcep/headplane:${{ steps.image.outputs.tag }}
            ghcr.io/nullrefexcep/headplane:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/NullRefExcep/headplane
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_TAG=ghcr.io/nullrefexcep/headplane:${{ steps.image.outputs.tag }}
            HEADPLANE_VERSION=${{ steps.image.outputs.tag }}-${{ steps.image.outputs.sha }}
